<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방문예약</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#101828}.w{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.c{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 15px 50px #0002}.h{background:#071a3b;color:#fff;padding:46px 36px;display:flex;flex-direction:column;justify-content:center}.h b{color:#ffe33d;letter-spacing:2px}.h h1{font-size:38px;margin:12px 0}.h p{font-size:18px;line-height:1.6}.tel{font-size:38px;font-weight:900;color:#ffe33d;text-decoration:none}.f{padding:36px}.site{font-size:25px;font-weight:900;color:#5725b8;margin-bottom:20px}label{display:block;font-weight:800;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:11px;font-size:16px}.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}.a{display:flex;gap:8px;margin:16px 0;font-size:13px}.a input{width:auto}.privacy{font-size:11px;line-height:1.5;background:#f8fafc;padding:9px;border-radius:8px;color:#667085}button{width:100%;margin-top:15px;padding:16px;border:0;border-radius:12px;background:#ffe33d;color:#28105f;font-size:19px;font-weight:900}.m{text-align:center;margin-top:12px;font-weight:800}@media(max-width:700px){.c{grid-template-columns:1fr}.h{padding:30px 24px}.f{padding:26px 20px}.r{grid-template-columns:1fr}}
</style></head><body><div class="w"><div class="c"><section class="h"><b>VISIT RESERVATION</b><h1>모델하우스 방문예약</h1><p>좋은 동·호수부터 빠르게 확인하세요.<br>예약 접수 후 담당자가 확인 연락드립니다.</p><a class="tel" href="tel:1800-1829">1800-1829</a></section><section class="f"><div class="site" id="s">현장 방문예약</div><form id="form"><label>성명</label><input name="name" required placeholder="성함을 입력하세요"><label>연락처</label><input name="phone" required inputmode="tel" placeholder="010-0000-0000"><div class="r"><div><label>방문일</label><input name="visitDate" type="date" required></div><div><label>방문시간</label><input name="visitTime" type="time" required></div></div><div class="a"><input id="agree" type="checkbox" required><label for="agree" style="margin:0">개인정보 수집·이용에 동의합니다.</label></div><div class="privacy">수집항목: 성명, 연락처, 방문일시 · 이용목적: 방문예약 확인 및 상담 · 보유기간: 목적 달성 후 지체 없이 파기(법령상 보존 의무가 있는 경우 해당 기간 보관) · 동의를 거부할 수 있으나 예약 접수가 제한될 수 있습니다.</div><button id="btn">방문예약 신청</button><div class="m" id="msg"></div></form></section></div></div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbwZuapyaGRF7rf1qCvVpACzqMJnD0aI3Lg2sYig8BSJlDhLZ5ICE3Y_QIza3_gO7Pzj/exec";
const site=(new URLSearchParams(location.search).get("site")||"모델하우스 방문예약").trim();document.getElementById("s").textContent=site;
const d=document.querySelector('[name=visitDate]');d.min=new Date().toISOString().slice(0,10);
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("msg"),btn=document.getElementById("btn");if(!ENDPOINT.startsWith("https://script.google.com/")){msg.textContent="예약 연동 주소 설정이 필요합니다.";return}const f=new FormData(e.target),p={site,name:f.get("name").trim(),phone:f.get("phone").trim(),visitDate:f.get("visitDate"),visitTime:f.get("visitTime"),source:"네이버 블로그",pageUrl:location.href};if(!/^01[016789]-?\d{3,4}-?\d{4}$/.test(p.phone)){msg.textContent="연락처를 확인해 주세요.";return}btn.disabled=true;btn.textContent="접수 중...";try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});const t=await r.text();let o={};try{o=JSON.parse(t)}catch{}if(!r.ok||o.ok===false)throw 0;msg.textContent="방문예약이 접수되었습니다.";e.target.reset()}catch(x){msg.textContent="접수 오류가 발생했습니다. 1800-1829로 연락해 주세요."}finally{btn.disabled=false;btn.textContent="방문예약 신청"}};
</script></body></html>
